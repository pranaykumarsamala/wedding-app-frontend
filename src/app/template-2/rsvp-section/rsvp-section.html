<section #rsvpSection class="rsvp-section position-relative">
    <div class="position-relative">
        <img class="water-background img-fluid" src="assets/template-2/water.png" alt="" />
        <img class="mudi-background img-fluid" src="assets/template-2/mudi.png" alt="" />
        <img class="peacock-background img-fluid" src="assets/template-2/peacock.png" alt="" />
        <img class="flower1 img-fluid" src="assets/template-2/flower.png" alt="" />
        <img class="flower2 img-fluid" src="assets/template-2/flower.png" alt="" />
        <img class="flower3 img-fluid" src="assets/template-2/flower.png" alt="" />
    </div>
    <div class="position-relative">
        <img src="assets/template-2/rsvp-bg.png" alt="" class="img-fluid rsvp-bg">
        <div class="gallery-slider">
            <div class="position-relative gallery-background">
                <!-- <img class="gallery-background img-fluid" src="assets/template-2/gallery.png" alt="" /> -->

                <div id="carouselExample" class="carousel slide position-absolute" data-bs-ride="carousel"
                    data-bs-interval="2000">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="/assets/template-one/one/gallery-slider-1.png" class="d-block w-100" alt="...">
                        </div>
                        <div class="carousel-item">
                            <img src="/assets/template-one/one/gallery-slider-2.png" class="d-block w-100" alt="...">
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="social-media">
            <h1>RSVP</h1>
            <h2>Social media page link</h2>
        </div>
        <div class="time">
            <div class="position-relative d-flex justify-content-center align-items-center">
                <img class="time-background img-fluid" src="assets/template-2/time-bg.png" alt="" />
                <div class="timer position-absolute">
                    <p>
                        {{ days | number: '2.0-0' }} : {{ hours | number: '2.0-0' }} :
                        {{ minutes | number: '2.0-0' }} : {{ seconds | number: '2.0-0' }}
                    </p>
                </div>
            </div>
        </div>
        <div class="rsvp-end">
            <img class="img-fluid palace-couple" src="assets/template-2/palace-couple.png" alt="" />
        </div>
    </div>
</section>
