<section #invitationSection class="invitation-section">

    <!-- Background -->
    <img
        class="invitation-background"
        src="assets/template-2/invitation-bg.png"
        alt=""
    />

    <!-- Peacock -->
    <img
        class="peacock"
        src="assets/template-2/Peacock.tif.png"
        alt=""
    />

    <!-- Main floral paper -->
    <div class="invitation-card">

        <div class="invitation-content">

            <!-- Character animation -->
            <h2 class="invitation-title split-chars">
                Invitation
            </h2>

            <!-- Word animation -->
            <h3 class="family-name split-words">
                Mr. and Mrs. Kumar
            </h3>

            <!-- Word animation -->
            <p class="invitation-message split-words">
                Request the pleasure of your<br />
                presence to grace the wedding of
            </p>

            <!-- Character animation -->
            <div class="save-date split-chars">
                Save the date
            </div>

            <!-- Word animation -->
            <div class="wedding-date split-words">
                DD / MM / YYYY
            </div>

            <!-- Word animation -->
            <div class="venue split-words">
                Add your Venue here, area, city, 000 000
            </div>

        </div>

    </div>
</section>
