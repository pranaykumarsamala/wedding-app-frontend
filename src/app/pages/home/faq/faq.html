<section class="faq-section">
  <div class="container faq-container">
    <h2 class="faq-title">FAQs</h2>

    <div class="faq-list">
      <div
        class="faq-item"
        *ngFor="let faq of faqs; let i = index"
        [class.active]="activeIndex === i"
      >
        <button
          type="button"
          class="faq-question"
          [attr.aria-expanded]="activeIndex === i"
          [attr.aria-controls]="'faq-answer-' + i"
          (click)="toggleFaq(i)"
        >
          <span class="faq-number">
            {{ (i + 1).toString().padStart(2, '0') }}
          </span>

          <span class="question-text">
            {{ faq.question }}
          </span>

          <span class="faq-icon" aria-hidden="true">
            {{ activeIndex === i ? '−' : '+' }}
          </span>
        </button>

        <div class="faq-answer" [id]="'faq-answer-' + i" *ngIf="activeIndex === i">
          {{ faq.answer }}
        </div>
      </div>
    </div>
  </div>
</section>
