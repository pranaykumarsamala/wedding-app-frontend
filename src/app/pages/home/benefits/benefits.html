<section class="benefits-section">
  <div class="benefits-header">
    <h2>BENEFITS:</h2>
  </div>

  <div class="container benefits-container">
    <!-- Comparison Table -->
    <div class="comparison-card">
      <div class="table-responsive">
        <table class="table benefits-table mb-0">
          <thead>
            <tr>
              <th class="feature-column"></th>
              <th>Printed Cards</th>
              <th>Whatsapp Videos</th>
              <th class="highlight-heading">
                <i class="fa-solid fa-envelope-open-text"></i> Scripted Invites
              </th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let row of benefits">
              <th scope="row" class="feature-column">
                <i [class]="row.icon + ' feature-icon'"></i>
                <span>{{ row.feature }}</span>
              </th>

              <td *ngFor="let value of row.values">
                {{ value }}
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
